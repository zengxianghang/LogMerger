name: Temporary EPH ION validation

on:
  push:
    branches:
      - fix/preserve-early-eph-ion

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: g++ -std=c++17 -O2 -Wall -Wextra -pedantic merge_aux_into_input.cpp -o merge_aux_into_input

      - name: Validate early EPH/ION carry-forward behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def crc32_value(value):
              for _ in range(8):
                  if value & 1:
                      value = (value >> 1) ^ 0xEDB88320
                  else:
                      value >>= 1
              return value & 0xFFFFFFFF

          def crc32_ascii(data):
              crc = 0
              for b in data.encode('ascii'):
                  temp1 = (crc >> 8) & 0x00FFFFFF
                  temp2 = crc32_value((crc ^ b) & 0xFF)
                  crc = (temp1 ^ temp2) & 0xFFFFFFFF
              return crc

          def line(body):
              return f"#{body}*{crc32_ascii(body):08x}\n"

          aux = [
              line("GPSCNAVEPHA,97,GPST,FINE,2430,123455000,0;early-cnav-1"),
              line("INSPVAA,COM1,0,0.0,FINE,2430,123455.500,0;stale-inspva"),
              line("GPSEPHA,97,GPST,FINE,2430,123455800,0;early-gpseph"),
              line("GPSCNAVEPHA,97,GPST,FINE,2430,123456500,0;between-cnav"),
          ]
          inp = [
              line("RANGEA,COM1,0,0.0,FINE,2430,123456.000,0;range-1"),
              line("RANGEA,COM1,0,0.0,FINE,2430,123457.000,0;range-2"),
          ]

          Path("aux.log").write_text("".join(aux), encoding="ascii")
          Path("input.log").write_text("".join(inp), encoding="ascii")
          PY

          ./merge_aux_into_input input.log aux.log output.log 0 2>stats.txt

          python3 - <<'PY'
          from pathlib import Path

          lines = Path("output.log").read_text(encoding="ascii").splitlines()
          names = [line[1:].split(',', 1)[0] for line in lines]
          payloads = [line.split(';', 1)[1].split('*', 1)[0] for line in lines]

          assert names == ["GPSCNAVEPHA", "GPSEPHA", "RANGEA", "GPSCNAVEPHA", "RANGEA"], names
          assert payloads == ["early-cnav-1", "early-gpseph", "range-1", "between-cnav", "range-2"], payloads
          assert all("stale-inspva" not in line for line in lines)

          stats = Path("stats.txt").read_text(encoding="utf-8")
          assert "inserted EPH/ION lines      : 3" in stats, stats
          assert "unmatched INSPVA before     : 1" in stats, stats
          assert "unmatched EPH/ION before   : 0" in stats, stats
          print("validation passed")
          PY
